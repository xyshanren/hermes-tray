<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hermes Chat</title>
    <!-- v0.2-alpha-2 — anti-flash theme bootstrap.
         Reads hermes-theme from localStorage and toggles .dark on <html>
         BEFORE main.ts loads. Kept inline (no module imports) so it runs
         synchronously in the head, ahead of any paint. main.ts will re-apply
         and attach the OS-preference listener once it boots. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('hermes-theme');
          var mode = (stored === 'light' || stored === 'dark' || stored === 'system') ? stored : 'system';
          var dark = mode === 'dark' ||
            (mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.dataset.theme = mode;
        } catch (e) { /* localStorage unavailable — fall through to default light */ }
      })();
    </script>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="app">
      <!-- Sidebar -->
      <aside id="sidebar" class="sidebar hidden">
        <div class="sidebar-header">
          <span class="sidebar-title">会话</span>
          <div class="sidebar-actions">
            <button id="sidebar-stats-btn" class="sidebar-icon-btn" title="Token / 成本统计 (T-Q-S9)">
              <svg viewBox="0 0 24 24" width="16" height="16">
                <path fill="currentColor" d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/>
              </svg>
            </button>
            <button id="sidebar-backup-btn" class="sidebar-icon-btn" title="加密备份 (T-Q-S11)">
              <svg viewBox="0 0 24 24" width="16" height="16">
                <path fill="currentColor" d="M19 12h-2v3h-3v2h3v3h2v-3h3v-2h-3v-3zM12 1 3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
              </svg>
            </button>
            <button id="sidebar-search-btn" class="sidebar-icon-btn" title="搜索 (Ctrl+K)">
              <svg viewBox="0 0 24 24" width="16" height="16">
                <path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
              </svg>
            </button>
            <button id="sidebar-new-btn" class="sidebar-icon-btn" title="新建会话">
              <svg viewBox="0 0 24 24" width="16" height="16">
                <path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
              </svg>
            </button>
            <button id="sidebar-toggle-btn" class="sidebar-icon-btn" title="收起侧栏">
              <svg viewBox="0 0 24 24" width="16" height="16">
                <path fill="currentColor" d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
              </svg>
            </button>
          </div>
        </div>
        <div id="session-list" class="session-list"></div>
      </aside>

      <!-- Main Content -->
      <div class="main-wrapper">
        <!-- Header -->
        <header class="header">
          <button id="sidebar-show-btn" class="sidebar-icon-btn sidebar-show" title="展开侧栏">
            <svg viewBox="0 0 24 24" width="18" height="18">
              <path fill="currentColor" d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
            </svg>
          </button>
          <div class="header-title">
            <span class="logo-icon">👔</span>
            <h1>Hermes Chat</h1>
          </div>
          <!-- T-Q-S7: Persona picker (auto-applies to new sessions) -->
          <div class="header-persona">
            <select id="persona-picker" class="persona-picker" title="选择 Persona（自动应用到新会话）">
              <option value="">— 无 (默认) —</option>
            </select>
            <button id="persona-manage-btn" class="sidebar-icon-btn" title="管理 Persona 库">
              <svg viewBox="0 0 24 24" width="16" height="16">
                <path fill="currentColor" d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65A.488.488 0 0 0 14 2h-4a.488.488 0 0 0-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1a.566.566 0 0 0-.18-.03c-.17 0-.34.09-.43.25l-2 3.46a.5.5 0 0 0 .12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65a.5.5 0 0 0-.12.64l2 3.46a.5.5 0 0 0 .61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.05.24.26.42.5.42h4a.5.5 0 0 0 .49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.06.02.12.03.18.03.17 0 .34-.09.43-.25l2-3.46a.5.5 0 0 0-.12-.64l-2.11-1.65zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/>
              </svg>
            </button>
          </div>
          <div class="header-status">
            <span id="connection-status" class="status-dot disconnected"></span>
            <span id="status-text">未连接</span>
          </div>
          <button id="settings-btn" class="settings-btn" title="设置">
            <svg viewBox="0 0 24 24" width="18" height="18">
              <path fill="currentColor" d="M19.14 12.94a7.07 7.07 0 0 0 .06-.94 7.07 7.07 0 0 0-.06-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a6.93 6.93 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.48.41l-.36 2.54a6.93 6.93 0 0 0-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87a.49.49 0 0 0 .12.61l2.03 1.58a7.07 7.07 0 0 0-.06.94c0 .32.02.64.06.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.04.7 1.62.94l.36 2.54c.05.24.26.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54a6.93 6.93 0 0 0 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.03-1.58zM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2z"/>
            </svg>
          </button>
          <!-- T-Q-S10: current-session share link (chat header) -->
          <button id="share-link-btn" class="settings-btn" title="复制分享链接 (T-Q-S10)">
            <svg viewBox="0 0 24 24" width="18" height="18">
              <path fill="currentColor" d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/>
            </svg>
          </button>
        </header>

        <!-- Chat Messages -->
        <main class="chat-container">
          <div id="messages" class="messages">
            <div class="welcome-message">
              <p>👋 欢迎使用 Hermes Chat</p>
              <p class="hint">在下方输入消息开始对话</p>
            </div>
          </div>
        </main>

      <!-- Input Area -->
      <footer class="input-area">
        <form id="chat-form" class="chat-form">
          <!-- T-Q-S14: attachment previews (drag-drop or click 📎 to add) -->
          <div id="attachment-previews" class="attachment-previews hidden"></div>
          <div class="chat-input-row">
            <button type="button" id="attach-btn" class="icon-btn" title="附加图片 (T-Q-S14, 也可直接拖拽)">
              <svg viewBox="0 0 24 24" width="18" height="18">
                <path fill="currentColor" d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/>
              </svg>
            </button>
            <input type="file" id="attach-file-input" accept="image/*" multiple style="display: none" />
            <button type="button" id="mic-btn" class="icon-btn" title="语音输入 (T-Q-S13, 点击开始, 再点停止并转写)">
              <svg viewBox="0 0 24 24" width="18" height="18">
                <path fill="currentColor" d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
              </svg>
            </button>
            <textarea
              id="message-input"
              placeholder="输入消息... (Enter 发送, Shift+Enter 换行, 可拖图片)"
              rows="1"
              autofocus
            ></textarea>
            <button type="submit" id="send-btn" disabled>
              <span id="send-btn-label">发送</span>
              <svg viewBox="0 0 24 24" width="20" height="20" id="send-btn-icon">
                <path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
              </svg>
            </button>
          </div>
        </form>
        <div class="input-info">
          <span id="model-name">-</span>
          <span id="char-count">0 / 4000</span>
        </div>
      </footer>

      </div><!-- /main-wrapper -->

      <!-- Toast Notifications (v0.2-alpha-6 — sonner <Toaster /> portal.
           Old #toast-container div removed; sonner renders into its own
           fixed-position container appended to <body>. The mount call
           lives in src/lib/toaster-mount.tsx, invoked from main.ts
           DOMContentLoaded. -->

      <!-- Search Modal (v0.2-alpha-7 — Preact component renders the panel
           into this overlay root. Inner content managed by
           src/views/search-modal.tsx; visibility (.hidden class) toggled
           by the searchModalStore subscription. -->
      <div id="search-modal" class="modal-overlay hidden"></div>

      <!-- Settings Modal (v0.2-alpha-11 — Preact component renders the panel
           into this overlay root. Inner content managed by
           src/views/settings-modal.tsx; visibility (.hidden class) toggled
           by the settingsStore subscription.) -->
      <div id="settings-modal" class="modal-overlay hidden"></div>

      <!-- Persona Library Modal (v0.2-alpha-8 — Preact component renders the
           inner panel into this overlay root. Header + close button +
           list/form/CRUD logic all live in src/views/persona-modal.tsx;
           visibility (.hidden class) toggled by the personaStore
           subscription set up in mountPersonaModal. -->
      <div id="persona-modal" class="modal-overlay hidden"></div>

      <!-- Token / Cost Stats Modal (T-Q-S9) — modal contents live in
           src/views/stats-modal.tsx; visibility (.hidden class) toggled
           by src/views/stats-modal-store.ts. -->
      <div id="stats-modal" class="modal-overlay hidden"></div>

      <!-- Backup Modal (T-Q-S11) — modal contents live in
           src/views/backup-modal.tsx; visibility (.hidden class) toggled
           by src/views/backup-modal-store.ts. -->
      <div id="backup-modal" class="modal-overlay hidden"></div>

<!-- Share Import Modal (T-Q-S10, alpha-15 Preact component).
       Replaces v0.1.5's native window.confirm() with a
       proper modal showing the decoded ShareDoc preview + Import/Cancel. -->
  <div id="share-import-modal" class="modal-overlay hidden"></div>

  <!-- Confirm Modal (v0.2-alpha-19 — Preact component replaces the last
       native window.confirm() call site in main.ts: the session-delete
       confirmation in the sidebar's × button. Generic enough to serve
       future confirmation flows too. -->
  <div id="confirm-modal" class="modal-overlay hidden"></div>
</body>
</html>
