[pytest]
# Restrict pytest discovery to this directory so it does not try to
# collect anything from the rest of the hermes-tray repo (no __init__.py
# anywhere up the tree, but explicit is better than implicit).
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Verbose by default — integration smoke tests are short, so the extra
# noise is cheap and the per-test status line is exactly what you want
# when triaging a failure in CI.
addopts = -v --tb=short

# Mark the suite as "integration" so it can be deselected in unit runs
# later if/when unit tests are added (e.g. `pytest -m "not integration"`).
markers =
    integration: tests that talk to a running hermes-agent-cn gateway
