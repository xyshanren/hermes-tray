name: Release

on:
  push:
    tags: ["v*"]

jobs:
  # ── Build Tauri on all platforms ───────────────────────────────────
  tauri-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # host default target = bundle target on every OS (ubuntu→x86_64-unknown-linux-gnu, macos→aarch64-apple-darwin, windows→x86_64-pc-windows-msvc). 不要用 --target, build 会走到 target/<triple>/release/bundle/ 而不是 target/release/bundle/ (artifact upload 找不到)
          - os: ubuntu-latest
            bundle: deb
          - os: macos-latest
            bundle: dmg
          - os: windows-latest
            bundle: msi

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/${{ matrix.bundle }}/**/*

  # ── Create GitHub Release ──────────────────────────────────────────
  release:
    needs: [tauri-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: tauri-*
          merge-multiple: true

      - name: Generate release notes
        run: |
          VERSION="${{ github.ref_name }}"
          cat > RELEASE_NOTES.md <<EOF
          ## Hermes Tray ${VERSION}

          Full release notes: [docs/RELEASE_${VERSION}.md](./blob/${VERSION}/docs/RELEASE_${VERSION}.md)

          ### Assets (Windows-only build today; macOS/Linux planned for next release)
          - \`*.msi\` — Windows MSI installer (企业 / silent install via \`msiexec /qn\`)
          - \`*setup.exe\` — NSIS setup (普通用户 / custom install path)
          - \`hermes-tray-tauri.exe\` — Portable (高级用户 / debug)

          See [CHANGELOG.md](./blob/${VERSION}/CHANGELOG.md) for the full version history.
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            **/*.deb
            **/*.AppImage
            **/*.dmg
            **/*.msi
            **/*setup.exe
            **/hermes-tray-tauri.exe
          fail_on_unmatched_files: false
