[package]
name = "hermes-tray-tauri"
version = "0.1.4"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "hermes_tray_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-window-state = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["stream", "multipart", "json"] }
tokio = { version = "1", features = ["io-util"] }
bytes = "1"
log = "0.4"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
# T-Q-S11: encryption for backup files. AES-256-GCM for authenticated
# encryption; Argon2id for password-based key derivation (resistant to
# GPU/ASIC brute-force); rand for cryptographically-secure nonces/salts.
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
# T-Q-S13: base64 for audio bytes from MediaRecorder (decoded in
# hermes_proxy_transcribe before constructing the multipart form).
base64 = "0.22"

