# .agent-teams/config.yaml
# Hermes-Tray Agent Teams 项目配置
# 维护: Mavis (M3) | 上次更新: 2026-06-04

project:
  name: hermes-tray
  type: tauri-desktop
  status: active-maintenance
  parent_workspace: Qoder
  upstream_dependency: hermes-agent-cn

paths:
  root: F:\work\workspace\Qoder\hermes-tray
  reviews: F:\work\workspace\MiniMax\projects\reports
  agent_teams: F:\work\workspace\Qoder\hermes-tray\.agent-teams

tech_stack:
  framework: Tauri 2.x
  frontend: TypeScript + Vite (TBD: Vue 3 + Element Plus migration when complexity grows)
  backend: Rust
  desktop: Windows tray app
  integration: WSL2 Hermes Gateway (HTTP :11451)
  python_status: removed-2026-06-04 (T-Q1 done, 6 dead files trashed, ~1083 lines + requirements.txt)

ci:
  - path: .github/workflows/ci.yml
    trigger: PR
  - path: .github/workflows/release.yml
    trigger: tag push (cross-platform build)

agent_routing:
  architect: architect (codebuddy 2.85.0) — Rust + Tauri 后端主力
  builder: builder (opencode mimo-v2.5-free) — TypeScript 前端
  scout: scout (atomcode + DeepSeek V4 Flash) — 调研 + 技术方案
  verifier: mavis-self (M3) — review-only channel

tech_boundary:
  user_does: [python, SQL, Redis, MongoDB]
  mavis_does: [frontend (TS/React/Vue/etc), Rust/Go/Java/C# (灰色兜底)]
  hermes_tray_specific: Tauri Rust 后端 + TS 前端 全归 Mavis. Python 死代码 (T-Q1) 删掉后, 此项目无用户自写代码.

key_constraints:
  - T-V1 = auto-approval enabled
  - T-V2 = user approval (on-demand, not per-task)
  - No concurrent projects (sequential, single active)
  - Qoder workspace = full-stack agent teams mode
  - User off-frontend: 任何 frontend 任务 Mavis 全包

review_cadence: T-V2 (monthly + on-demand key node)

last_review: 2026-06-04
next_review: 2026-07-04 (T-V2 monthly)
